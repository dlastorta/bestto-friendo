services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tournament_manager
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tournament_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament -d tournament_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tournament_postgres:
